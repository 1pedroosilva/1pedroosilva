<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Relação entre os três projetos</title>
<desc id="d">O pipeline da CVM gera as regras que viram skills; as skills orientam o agente no pipeline; uma versão congelada das skills é medida na avaliação; o resultado da avaliação decide o que sai das skills.</desc>
<style>
.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:11px;fill:#5A6560}
.r{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:11px;fill:#0F4C42}
.t{font-family:Newsreader,Georgia,'Times New Roman',serif;font-size:19px;fill:#16201C}
.l{fill:none;stroke:#5A6560;stroke-width:1}
.a{fill:none;stroke:#0F4C42;stroke-width:1.2}
.d{stroke-dasharray:4 4}
.g{stroke:#BFC6C0;stroke-width:1}
</style>
<defs>
<marker id="hs" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#5A6560" stroke-width="1.1"/></marker>
<marker id="ha" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.8 L7 4 L0 7.2" fill="none" stroke="#0F4C42" stroke-width="1.2"/></marker>
</defs>
<line class="g" x1="114" y1="112" x2="166" y2="112"/>
<text class="r" x="140" y="104" text-anchor="middle">construir</text>
<text class="t" x="140" y="140" text-anchor="middle">Pipeline da CVM</text>
<text class="m" x="140" y="162" text-anchor="middle">DRE, BPA e BPP, 2021 a 2026</text>
<line class="g" x1="414" y1="112" x2="466" y2="112"/>
<text class="r" x="440" y="104" text-anchor="middle">instruir</text>
<text class="t" x="440" y="140" text-anchor="middle">Skills para o Genie Code</text>
<text class="m" x="440" y="162" text-anchor="middle">14 skills versionadas em Git</text>
<line class="g" x1="714" y1="112" x2="766" y2="112"/>
<text class="r" x="740" y="104" text-anchor="middle">medir</text>
<text class="t" x="740" y="140" text-anchor="middle">Avaliação das skills</text>
<text class="m" x="740" y="162" text-anchor="middle">24 sessões, com e sem skills</text>
<path class="a" d="M200 88 C 245 34, 335 34, 380 88" marker-end="url(#ha)"/>
<text class="m" x="290" y="36" text-anchor="middle">erro repetido do agente vira regra</text>
<path class="a" d="M500 88 C 545 34, 635 34, 680 88" marker-end="url(#ha)"/>
<text class="m" x="590" y="36" text-anchor="middle">versão congelada em 6c7933e</text>
<path class="l" d="M380 180 C 335 232, 245 232, 200 180" marker-end="url(#hs)"/>
<text class="m" x="290" y="246" text-anchor="middle">a regra orienta o agente</text>
<path class="l d" d="M680 180 C 635 232, 545 232, 500 180" marker-end="url(#hs)"/>
<text class="m" x="590" y="246" text-anchor="middle">o que não se sustentar sai</text>
<line class="l d" x1="730" y1="270" x2="754" y2="270"/>
<text class="m" x="762" y="274" style="font-size:10px">ainda não aconteceu</text>
</svg>